<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI Flight Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h2>AI 항공편 검색</h2>

    <div class="mb-3">
        <input id="message" class="form-control" placeholder="예) 내일 오후 2시 이후 광주에서 제주 가는 항공편 알려줘"/>
    </div>

    <button class="btn btn-primary" onclick="coordinate()">Coordinator</button>
    <button class="btn btn-warning" onclick="a2a()">A2A</button>

    <hr>

    <div id="result"></div>

</div>

<script>
    async function coordinate() {
        const message = document.getElementById("message").value;

        const response =
            await fetch("/coordinator", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({message: message})
            });

        const data = await response.json();
        renderResult(data);
    }

    async function a2a() {

    }

    function renderResult(result) {
        const container = document.getElementById("result");

        if (!result.success) {
            container.innerHTML =
                `<div class="alert alert-danger">
                    ${result.message}
                 </div>`;
            return;
        }

        let html = "";

        html += `
            <div class="card mb-3">
                <div class="card-header">
                    검색 조건
                </div>

                <div class="card-body">
                    출발 : ${result.param.departure}<br>
                    도착 : ${result.param.arrival}<br>
                    날짜 : ${result.param.date}<br>
                    시간 : ${result.param.afterTime ?? "-"}
                </div>
            </div>
        `;

        result.data.forEach(group => {
            html += `
                <div class="card mb-3">

                    <div class="card-header">
                        ${group.airlineName}
                    </div>

                    <div class="card-body">
            `;

            group.flights.forEach(flight => {
                html += `
                    <div class="border rounded p-2 mb-2">
                        <b>${flight.vihicleId}</b>

                        <br>
                        출발 : ${formatTime(flight.depPlandTime)} → 도착 : ${formatTime(flight.arrPlandTime)}
                        <br>
                        일반석 : ${flight.economyCharge.toLocaleString()}원
                    </div>
                `;
            });

            html += `
                    </div>
                 </div>
            `;
        });

        container.innerHTML = html;
    }

    function formatTime(time) {
        return time.substring(8, 10) + ":" + time.substring(10, 12);
    }
</script>

</body>
</html>
