<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>문의 상세</title>

    <link rel="stylesheet" th:href="@{/bootstrap.min.css}">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4>문의 상세</h4>
        <span class="badge"
              th:classappend="${inquiry.answer() != null} ? 'bg-success' : 'bg-warning text-dark'"
              th:text="${inquiry.answer() != null} ? '답변 완료' : '답변 안됨'">
        </span>
    </div>

    <table class="table">
        <tr>
            <th style="width: 20%">제목</th>
            <td th:text="${inquiry.title}"></td>
        </tr>
        <tr>
            <th>분류</th>
            <td th:text="${inquiry.category.description}"></td>
        </tr>
        <tr>
            <th>작성일</th>
            <td th:text="${#temporals.format(inquiry.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
    </table>

    <div class="mb-4">
        <h5>문의 내용</h5>
        <div class="border p-3 bg-white"
             style="white-space: pre-wrap;"
             th:text="${inquiry.content}">
        </div>
    </div>

    <div class="mb-4" th:if="${!#lists.isEmpty(inquiry.files)}">
        <h5>첨부 파일</h5>
        <div class="d-flex gap-2 flex-wrap">
            <a th:each="fileName : ${inquiry.files}"
               th:href="@{'/uploads/' + ${fileName}}"
               target="_blank">

                <img th:src="@{'/uploads/' + ${fileName}}"
                     style="width:150px; height:150px; object-fit:cover; border:1px solid #ddd;">
            </a>
        </div>
    </div>

    <div th:if="${inquiry.answer() != null}" class="mt-4">
        <h5 class="text-success">답변</h5>

        <div class="border p-3 bg-light mb-3"
             style="white-space: pre-wrap;"
             th:text="${inquiry.answer.content}">
        </div>

        <table class="table">
            <tr>
                <th style="width: 20%">답변일</th>
                <td th:text="${#temporals.format(inquiry.answer.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
            </tr>
            <tr>
                <th>담당자</th>
                <td th:text="${inquiry.answer.responderId}"></td>
            </tr>
        </table>
    </div>

    <div th:if="${inquiry.answer() == null}" class="text-center text-muted mt-4">
        답변 대기 중입니다.
    </div>

    <div class="text-end mt-4">
        <a th:href="@{/cs/}" class="btn btn-secondary">목록으로</a>
    </div>

</div>
</body>
</html>
