<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 - 문의 목록</title>

    <link rel="stylesheet" th:href="@{/bootstrap.min.css}">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="mb-4">관리자 문의 관리</h3>

        <div class="d-flex gap-2">
            <form th:action="@{/cs/logout}" method="post">
                <button class="btn btn-outline-danger btn-sm">로그아웃</button>
            </form>
        </div>
    </div>
    <div class="card">
        <div class="card-body p-0">
            <table class="table table-hover mb-0" th:if="${!#lists.isEmpty(inquiries)}">
                <thead class="table-light">
                <tr>
                    <th>제목</th>
                    <th>분류</th>
                    <th>작성일</th>
                    <th>답변 여부</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="inquiry : ${inquiries}"
                    th:onclick="|location.href='@{/cs/admin/answer/{id}(id=${inquiry.inquiryId})}'|"
                    style="cursor:pointer;">

                    <td th:text="${inquiry.title}"></td>

                    <td th:text="${inquiry.category.description}"></td>

                    <td th:text="${#temporals.format(inquiry.createdAt, 'yyyy-MM-dd HH:mm')}"></td>

                    <td>
                        <span class="badge"
                              th:classappend="${inquiry.answered()} ? 'bg-success' : 'bg-warning text-dark'"
                              th:text="${inquiry.answered()} ? '완료' : '대기'">
                        </span>
                    </td>

                </tr>
                </tbody>
            </table>

            <div class="p-4 text-center text-muted"
                 th:if="${#lists.isEmpty(inquiries)}">
                답변이 필요한 문의가 없습니다.
            </div>

        </div>
    </div>

</div>

</body>
</html>
