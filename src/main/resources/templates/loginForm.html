<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{login.title}">로그인</title>

    <link rel="stylesheet" th:href="@{/bootstrap.min.css}">
</head>

<body class="bg-light">
<div class="container mt-5" style="max-width: 400px;">
    <div class="card shadow-sm p-4">
        <h3 class="text-center mb-4" th:text="#{login.title}">로그인</h3>

        <div class="text-end mb-3">
            <a href="?locale=ko" class="me-2">한국어</a>
            <a href="?locale=en">English</a>
        </div>

        <form action="/cs/login" method="post">
            <div class="mb-3">
                <label for="inputId" th:text="#{login.id}">ID</label>
                <input type="text"
                       class="form-control"
                       id="inputId"
                       name="id"
                       th:value="${param.id}"
                       required>
            </div>

            <div class="mb-3">
                <label for="inputPassword" th:text="#{login.password}">Password</label>
                <input type="password"
                       class="form-control"
                       id="inputPassword"
                       name="pwd"
                       required>
            </div>

            <div th:if="${error}" class="mb-3 text-danger small">
                <span th:text="${error}">에러 메시지</span>
            </div>

            <div class="d-grid">
                <button type="submit"
                        class="btn btn-primary"
                        th:text="#{login.button}">
                        로그인
                </button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
