<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>나의 문의 목록</title>

    <link rel="stylesheet" th:href="@{/bootstrap.min.css}">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3><span th:text="${name}"></span>님의 문의 목록</h3>

        <div class="d-flex gap-2">
            <form th:action="@{/cs/logout}" method="post">
                <button class="btn btn-outline-danger btn-sm">로그아웃</button>
            </form>

            <a th:href="@{/cs/inquiry}" class="btn btn-primary btn-sm">문의하기</a>
        </div>
    </div>

    <form th:action="@{/cs}" method="get" class="row g-2 mb-4">
        <div class="col-auto">
            <select name="category" class="form-select">
                <option value="">전체</option>
                <option th:each="categoryEnum : ${categories}"
                        th:value="${categoryEnum.name()}"
                        th:text="${categoryEnum.description}"
                        th:selected="${categoryEnum == selectedCategory}">
                </option>
            </select>
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-primary">검색</button>
        </div>
        <div class="col-auto">
            <a th:href="@{/cs}" class="btn btn-outline-secondary">전체보기</a>
        </div>
    </form>

    <div class="card">
        <div class="card-body p-0">

            <table class="table table-hover mb-0" th:if="${!#lists.isEmpty(inquiries)}">
                <thead class="table-light">
                <tr>
                    <th>제목</th>
                    <th>분류</th>
                    <th>작성일</th>
                    <th>답변여부</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="inquiry : ${inquiries}">
                    <td>
                        <a th:href="@{/cs/inquiries/{id}(id=${inquiry.inquiryId})}"
                           th:text="${inquiry.title}">
                        </a>
                    </td>
                    <td th:text="${inquiry.category.description}"></td>
                    <td th:text="${#temporals.format(inquiry.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${inquiry.answered()} ? 'bg-success' : 'bg-warning text-dark'"
                              th:text="${inquiry.answered()} ? '답변 완료' : '답변 안됨'">
                        </span>
                    </td>
                </tr>
                </tbody>
            </table>

            <div class="p-4 text-center text-muted"
                 th:if="${#lists.isEmpty(inquiries)}">
                문의 내역이 없습니다.
            </div>

        </div>
    </div>

</div>

</body>
</html>
